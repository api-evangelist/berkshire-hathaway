note: >-
  No API plans or pricing are published anywhere in the group. Berkshire Hathaway itself sells no
  API. The BNSF Customer API (profiled in full under the bnsf record) is offered to existing BNSF
  shipping customers at no stated price: onboarding is a registration via the customer portal's
  Message Us box with a bnsf.com User ID and a CA-issued client certificate, and Restricted
  Services are granted by request. There is no self-serve sign-up, no metered tier and no price
  list. This REPLACES the 2026-05-04 scaffold, whose Free/Professional/Enterprise tiers were bulk-sweep
  defaults the provider never published.
